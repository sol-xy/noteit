services:
  noteit-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noteit-backend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
